<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuadro</title>
    <style>
        .recuadro * {
            box-sizing: border-box;
        }

        .recuadro {
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            width: 600px;
            height: 800px;
            background-color: bisque;
            display: grid;
            place-items: center;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .marcador {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 32px;
            color: #f7f4e9;
            background: #123d32;
        }

        .video-fondo {
            position: absolute;
            z-index: -1;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .marcador> :not(.video-fondo) {
            position: relative;
            z-index: 1;
        }

        .cabecera {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            font: 700 14px/1.2 Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .partido {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            text-align: center;
            display: flex;
            justify-content: space-around;
        }

        .equipo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            font: 700 19px/1.2 Arial, sans-serif;
            letter-spacing: 1.5px;
        }

        .insignia {
            display: block;
            width: 96px;
            height: 96px;
            object-fit: cover;
        }

        .insignia[hidden] {
            display: none;
        }

        .marcador-central {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .puntos {
            color: #fff;
            font: 700 100px/1 Arial, sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .puntuacion {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .ensayos {
            color: #d8e0d8;
            font: 400 25px/1 Arial, sans-serif;
            letter-spacing: 0;
        }

        .reloj {
            padding: 0 24px 8px;
            color: #ffffff;
            font: 700 50px/1 Consolas, monospace;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .periodo {
            color: #d8e0d8;
            font: 700 12px/1.2 Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .pie {
            display: flex;
            justify-content: center;
            background: #fff;
        }

        .pie img {
            display: block;
            width: 250px;
            height: auto;
        }

        .panel-control,
        .panel-control * {
            box-sizing: border-box;
        }

        .panel-config,
        .panel-config * {
            box-sizing: border-box;
        }

        .panel-control {
            position: absolute;
            left: 620px;
            top: 0;
            width: 320px;
            height: 800px;
            padding: 24px;
            overflow-y: auto;
            color: #173d32;
            background: #f4f1e8;
            border: 1px solid #c8c2ad;
            font-family: Arial, sans-serif;
        }

        .panel-config {
            position: absolute;
            left: 960px;
            top: 0;
            width: 280px;
            height: 800px;
            padding: 24px;
            color: #173d32;
            background: #f4f1e8;
            border: 1px solid #c8c2ad;
            font-family: Arial, sans-serif;
        }

        .panel-config label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .panel-config select {
            width: 100%;
            min-height: 40px;
            padding: 8px 10px;
            color: #173d32;
            background: #fff;
            border: 1px solid #a8b5a8;
            border-radius: 3px;
            font: 14px Arial, sans-serif;
        }

        .panel-cabecera {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #173d32;
        }

        .panel-cabecera p {
            margin: 0 0 6px;
            color: #a53d35;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .panel-cabecera h1 {
            margin: 0;
            font: 700 24px/1.1 Georgia, 'Times New Roman', serif;
        }

        .seccion-control {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid #c8c2ad;
        }

        .seccion-control h2 {
            margin: 0 0 12px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .estado-reloj {
            margin: 0 0 10px;
            color: #52645c;
            font-size: 12px;
        }

        .controles-reloj {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .boton-reloj {
            min-height: 40px;
            padding: 8px;
            color: #fff;
            background: #173d32;
            border: 0;
            border-radius: 3px;
            font: 700 12px/1.2 Arial, sans-serif;
            cursor: pointer;
        }

        .boton-reloj:hover {
            background: #285c4b;
        }

        #iniciar-reloj {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #26734d;
        }

        #iniciar-reloj:hover {
            background: #1c5d3d;
        }

        #pausar-reloj {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #b43c35;
        }

        #pausar-reloj:hover {
            background: #8f2f2a;
        }

        .icono-reloj {
            font-size: 14px;
            line-height: 1;
        }

        #cambiar-parte {
            color: #173d32;
            background: #e4d4a8;
        }

        #cambiar-parte:hover {
            background: #d7c28c;
        }

        #resetear-reloj {
            color: #812d28;
            background: #ead5d0;
        }

        #resetear-reloj:hover {
            background: #dfc1ba;
        }

        .equipo-control {
            margin-bottom: 22px;
        }

        .equipo-control h2 {
            margin: 0 0 12px;
            padding-left: 10px;
            border-left: 4px solid #a53d35;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .equipo-control.visitante-control h2 {
            border-left-color: #d5a64a;
        }

        .fila-puntuacion {
            padding: 7px 0;
            border-bottom: 1px solid #dedacc;
        }

        .acciones-puntuacion {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .boton-puntos {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            min-width: 0;
            min-height: 38px;
            padding: 6px 10px;
            color: #174d38;
            background: #e0eee5;
            border: 1px solid #a8c8b3;
            border-radius: 4px;
            box-shadow: 0 2px 5px #173d3215;
            font: 600 13px/1.2 Arial, sans-serif;
            text-align: left;
            cursor: pointer;
            transition: background-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
        }

        .signo-puntos {
            flex: 0 0 auto;
            font-size: 18px;
            font-weight: 700;
        }

        .boton-puntos:hover {
            background: #cee3d4;
            box-shadow: 0 3px 8px #173d3230;
            transform: translateY(-1px);
        }

        .boton-puntos.restar {
            color: #812d28;
            background: #f4e3df;
            border-color: #dbb2aa;
        }

        .boton-puntos.restar:hover {
            background: #ead0c9;
        }

        button:focus-visible {
            outline: 3px solid #d5a64a;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="recuadro">
        <main class="marcador" aria-label="Marcador de rugby">
            <video class="video-fondo" autoplay muted loop playsinline aria-hidden="true">
                <source src="img/fondo.mp4" type="video/mp4">
            </video>
            <header class="cabecera">
                <div class="marcador-central">
                    <div class="periodo">1. ZATIA</div>
                    <div class="reloj">00:00</div>

                </div>
            </header>

            <section class="partido" aria-label="Resultado del partido">
                <div class="equipo anfitrion">
                    <img class="insignia" src="img/drb.jpg" alt="Escudo del equipo local">
                    <span>DONOSTIA RUGBY<br>BALEZALEOK</span>
                    <span class="puntuacion"><span class="puntos" id="puntos-local">0</span><span class="ensayos"
                            id="ensayos-local">0</span></span>
                </div>

                <div class="equipo visitante">
                    <img class="insignia" id="insignia-visitante" alt="" hidden>
                    <span class="insignia" id="marcador-visitante" aria-hidden="true">V</span>
                    <span id="nombre-visitante">VISITANTE</span>
                    <span class="puntuacion"><span class="puntos" id="puntos-visitante">0</span><span class="ensayos"
                            id="ensayos-visitante">0</span></span>
                </div>
            </section>

            <footer class="pie">
                <img src="img/DonostiaKirola.svg" alt="Donostia Kirola">
            </footer>
        </main>
    </div>

    <aside class="panel-control" aria-label="Panel de control del partido">
        <header class="panel-cabecera">
            <p>RUGBY / CONTROL</p>
            <h1>Partido</h1>
        </header>

        <section class="seccion-control" aria-labelledby="titulo-reloj">
            <h2 id="titulo-reloj">Cronómetro</h2>
            <p class="estado-reloj" id="estado-reloj" aria-live="polite">En pausa</p>
            <div class="controles-reloj">
                <button class="boton-reloj" id="iniciar-reloj" type="button"><span class="icono-reloj"
                        aria-hidden="true">▶</span> Iniciar</button>
                <button class="boton-reloj" id="pausar-reloj" type="button"><span class="icono-reloj"
                        aria-hidden="true">Ⅱ</span> Pausar</button>
                <button class="boton-reloj" id="cambiar-parte" type="button">Cambiar parte</button>
                <button class="boton-reloj" id="resetear-reloj" type="button">Resetear</button>
            </div>
        </section>

        <section class="equipo-control" aria-labelledby="titulo-local">
            <h2 id="titulo-local">Local</h2>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="local" data-points="5" data-try-delta="1"
                        aria-label="Sumar 5 puntos por ensayo al equipo local"><span class="signo-puntos">+</span>
                        Ensayo</button>
                    <button class="boton-puntos restar" type="button" data-team="local" data-points="-5"
                        data-try-delta="-1" aria-label="Restar 5 puntos por ensayo al equipo local"><span
                            class="signo-puntos">−</span> Ensayo</button>
                </span>
            </div>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="local" data-points="2"
                        aria-label="Sumar 2 puntos por transformación al equipo local"><span
                            class="signo-puntos">+</span> Transformación</button>
                    <button class="boton-puntos restar" type="button" data-team="local" data-points="-2"
                        aria-label="Restar 2 puntos por transformación al equipo local"><span
                            class="signo-puntos">−</span> Transformación</button>
                </span>
            </div>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="local" data-points="3"
                        aria-label="Sumar 3 puntos por golpe de castigo al equipo local"><span
                            class="signo-puntos">+</span> Golpe</button>
                    <button class="boton-puntos restar" type="button" data-team="local" data-points="-3"
                        aria-label="Restar 3 puntos por golpe de castigo al equipo local"><span
                            class="signo-puntos">−</span> Golpe</button>
                </span>
            </div>
        </section>

        <section class="equipo-control visitante-control" aria-labelledby="titulo-visitante">
            <h2 id="titulo-visitante">Visitante</h2>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="visitante" data-points="5" data-try-delta="1"
                        aria-label="Sumar 5 puntos por ensayo al equipo visitante"><span class="signo-puntos">+</span>
                        Ensayo</button>
                    <button class="boton-puntos restar" type="button" data-team="visitante" data-points="-5"
                        data-try-delta="-1" aria-label="Restar 5 puntos por ensayo al equipo visitante"><span
                            class="signo-puntos">−</span> Ensayo</button>
                </span>
            </div>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="visitante" data-points="2"
                        aria-label="Sumar 2 puntos por transformación al equipo visitante"><span
                            class="signo-puntos">+</span> Transformación</button>
                    <button class="boton-puntos restar" type="button" data-team="visitante" data-points="-2"
                        aria-label="Restar 2 puntos por transformación al equipo visitante"><span
                            class="signo-puntos">−</span> Transformación</button>
                </span>
            </div>
            <div class="fila-puntuacion">
                <span class="acciones-puntuacion">
                    <button class="boton-puntos" type="button" data-team="visitante" data-points="3"
                        aria-label="Sumar 3 puntos por golpe de castigo al equipo visitante"><span
                            class="signo-puntos">+</span> Golpe</button>
                    <button class="boton-puntos restar" type="button" data-team="visitante" data-points="-3"
                        aria-label="Restar 3 puntos por golpe de castigo al equipo visitante"><span
                            class="signo-puntos">−</span> Golpe</button>
                </span>
            </div>
        </section>
    </aside>

    <aside class="panel-config" aria-label="Panel de configuración">
        <header class="panel-cabecera">
            <p>RUGBY / AJUSTES</p>
            <h1>Configuración</h1>
        </header>
        <section class="seccion-control" aria-labelledby="titulo-equipo-visitante">
            <h2 id="titulo-equipo-visitante">Equipo visitante</h2>
            <label for="seleccionar-visitante">Equipo</label>
            <select id="seleccionar-visitante">
                <option value="" selected disabled>Seleccionar equipo</option>
                <option value="Betsaide Elorrio RT.jpg">BETSAIDE ELORRIO RT</option>
                <option value="Cormorán RC.jpg">CORMORÁN RC</option>
                <option value="Durango RT.jpg">DURANGO RT</option>
                <option value="Gaztedi RT.jpg">GAZTEDI RT</option>
                <option value="Geurea RT.jpg">GEUREA RT</option>
                <option value="Hernani RCE.jpg">HERNANI RCE</option>
                <option value="La Unica RT.jpg">LA UNICA RT</option>
                <option value="Pasek Belenos.jpg">PASEK BELENOS</option>
                <option value="RC Rioja.jpeg">RC RIOJA</option>
                <option value="Rugby Aranda Freund.jpg">RUGBY ARANDA FREUND</option>
                <option value="Txingudi RC.png">TXINGUDI RC</option>
                <option value="Universitario Bilbao Rugby.jpg">UNIVERSITARIO BILBAO RUGBY</option>
                <option value="Uribealdea RKE.jpg">URIBEALEA RKE</option>
            </select>
        </section>
    </aside>

    <script>
        const puntuaciones={local: 19, visitante: 14};
        const ensayos={local: 3, visitante: 2};
        const reloj=document.querySelector('.reloj');
        const periodo=document.querySelector('.periodo');
        const estadoReloj=document.querySelector('#estado-reloj');
        let segundosTranscurridos=62*60+14;
        let intervaloReloj=null;
        let segundaParte=false;

        const selectorVisitante=document.querySelector('#seleccionar-visitante');
        const insigniaVisitante=document.querySelector('#insignia-visitante');
        const marcadorVisitante=document.querySelector('#marcador-visitante');
        const nombreVisitante=document.querySelector('#nombre-visitante');

        selectorVisitante.addEventListener('change', () => {
            const equipo=selectorVisitante.options[selectorVisitante.selectedIndex].textContent;
            insigniaVisitante.src=`img/equipos/${encodeURIComponent(selectorVisitante.value)}`;
            insigniaVisitante.alt=`Escudo de ${equipo}`;
            insigniaVisitante.hidden=false;
            marcadorVisitante.hidden=true;
            nombreVisitante.textContent=equipo;
        });

        function actualizarReloj() {
            const minutos=Math.floor(segundosTranscurridos/60).toString().padStart(2, '0');
            const segundos=(segundosTranscurridos%60).toString().padStart(2, '0');
            reloj.textContent=`${minutos}:${segundos}`;
        }

        document.querySelector('#iniciar-reloj').addEventListener('click', () => {
            if(intervaloReloj!==null) return;
            estadoReloj.textContent='En marcha';
            intervaloReloj=window.setInterval(() => {
                segundosTranscurridos+=1;
                actualizarReloj();
            }, 1000);
        });

        document.querySelector('#pausar-reloj').addEventListener('click', () => {
            if(intervaloReloj!==null) {
                window.clearInterval(intervaloReloj);
                intervaloReloj=null;
            }
            estadoReloj.textContent='En pausa';
        });

        document.querySelector('#resetear-reloj').addEventListener('click', () => {
            if(intervaloReloj!==null) {
                window.clearInterval(intervaloReloj);
                intervaloReloj=null;
            }
            segundosTranscurridos=segundaParte? 40*60:0;
            actualizarReloj();
            estadoReloj.textContent='En pausa';
        });

        document.querySelector('#cambiar-parte').addEventListener('click', () => {
            segundaParte=!segundaParte;
            segundosTranscurridos=segundaParte? 40*60:0;
            periodo.textContent=segundaParte? '2. ZATIA':'1. ZATIA';
            actualizarReloj();
        });

        document.querySelectorAll('[data-team][data-points]').forEach((boton) => {
            boton.addEventListener('click', () => {
                const equipo=boton.dataset.team;
                puntuaciones[equipo]=Math.max(0, puntuaciones[equipo]+Number(boton.dataset.points));
                const cambioEnsayos=Number(boton.dataset.tryDelta||0);
                ensayos[equipo]=Math.max(0, ensayos[equipo]+cambioEnsayos);
                document.querySelector(`#puntos-${equipo}`).textContent=puntuaciones[equipo];
                document.querySelector(`#ensayos-${equipo}`).textContent=`(${ensayos[equipo]} T)`;
            });
        });
    </script>
</body>

</html>
